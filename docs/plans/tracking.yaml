# =============================================================================
# TRACKING V2 — fuente de verdad operativa (consumible por máquinas)
# =============================================================================
# Este archivo es el SSOT operativo del sistema de ingeniería. El documento
# PLAN-Maestro-Ingenieria.md es el MAPA; aquí vive el ESTADO.
#
# Cadena de trazabilidad por hallazgo (ver PLAN-Maestro-Ingenieria.md §2):
#   Hallazgo → Backlog → ADR → Implementación → Tests → CI → Evidencia → Cierre
#
# Estados cerrados (enum — SSOT; el job `tracking-consistency` los valida):
#   estado:           PENDIENTE | EN_CURSO | HECHO | VERIFICACION | RECHAZADO
#   estado_auditoria: CONFIRMADO | NO_CONFIRMADO | PARCIALMENTE_CONFIRMADO | REFORMULADO
#                     PARCIALMENTE_CONFIRMADO = requiere resolución (confirmar/descartar) en F0
#   eslabon_estado:   NO_APLICA | PENDIENTE | HECHO
#                     (el eslabón `cadena.hallazgo` usa también los estados de
#                      estado_auditoria: HECHO | PARCIALMENTE_CONFIRMADO)
#
# Reglas de coherencia (validadas por job `tracking-consistency` en CI):
#   - todo `regla.hallazgo_informe` DEBE ser un ID plano `H-NN` o `B-NN` no vacío.
#   - `estado: HECHO` requiere `fecha_cierre` y `cadena.cierre.evidencia`.
#   - `estado_auditoria: CONFIRMADO` requiere `evidencia` no vacía.
#   - toda `regla` con `backtest: ok` DEBE tener `activada_en_ci: true`.
#   - todo eslabón en `cadena` debe usar un eslabon_estado del enum.
#   - umbrales numéricos solo tras medición en vivo en F0 (nada inventado).
# =============================================================================

# ------------------------------------------------------------------
