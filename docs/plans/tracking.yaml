  solucion: |
    PARTE 1 (HECHO): unit systemd del streaming versionada (deploy/systemd/ocm-streaming.service, ADR-0022 §7), validación sintáctica systemd-analyze verify PASS + test_deploy_artifacts (15 tests).
    PARTE 2 (HECHO, artifact digest ADR-0037): Dockerfile de producción CORREGIDO (uv sync --no-dev --system era inválido en uv 0.11.14 — build roto; ahora UV_PROJECT_ENVIRONMENT=/usr/local + COPY packages/apps/ocm/shared para el remap editable). Job artifact-build en ocm-ci.yml (push main): build + config digest {{.Id}} + upload artifact inmutable. deploy_ocm.sh --verify-artifact: verifica digest antes de deploy (ACCEPT/REJECT validado end-to-end).
    HALLAZGOS REALES (2026-08-19): (1) docker save | sha256sum NO es determinista (tar con metadatos variables) → se usa config digest; (2) docker build NO es reproducible (pip/uv layers no deterministas) → el digest solo es verificable si build y deploy ocurren en el mismo contexto; (3) 0 self-hosted runners en OrangeHouse → ocm-cd.yml corre en GitHub-hosted runner, NO en el host de producción.
