  evidencia: 'Path Kappa OHLCV no conectado en produccion. _build_ohlcv (pipeline_factory.py:190)
    NO inyecta publisher ni _chunk_converter; OHLCVPipeline hardcodea _publisher=NullPublisher()
    con comentario falso ''Inyectado por CompositionRoot'' (ohlcv_pipeline.py:248);
    _build_kafka_publisher (pipeline_factory.py:156) sin callers (codigo muerto);
    PipelineContext._chunk_converter=None (runtime.py:298) -> get_chunk_converter()
    lanza RuntimeError (runtime.py:311-323). Incremental/Backfill llaman converter
    antes de publish_chunk (incremental.py:106/116, backfill.py:427/437); storage=None
    es valido solo para Repair (runtime.py:269-271, repair.py:488). Ambos entrypoints
    prod: entrypoint.py:77, main.py:149 (docker-compose.yml:358). Broma historica:
    fe4525f(17-may, Null pub return True), 673d1b0(20-may, default NullPublisher),
    1dd4f75(19-may wiring kwargs) roto por 7162784(20-may firma CR) y eliminado por
    9e659be(20-may ''fix mypy''). Esta conectado con F-027/B-43 (KAFKA_ENABLED huerfana)'
  solucion: 'IMPLEMENTADO — Opción B: Fail-fast en producción / degradación honesta
    fuera de producción. Fail-fast estructural en OHLCVPipeline.__init__ y en pipeline_factory._build_ohlcv
    impide NullOHLCVPublisher cuando environment=production. Regla L5 PRODUCTION_REQUIRES_KAFKA_PUBLISHER
    adelanta el fail-fast a config-load (ocm/config/layers/rules.py). Fuera de producción,
    warning loguru visible y NullOHLCVPublisher explícito como modo degradado documentado.
    NullOHLCVPublisher sigue existiendo para tests y modo degradado explícito fuera
    de producción; riesgo residual documentado.'
  pruebas:
