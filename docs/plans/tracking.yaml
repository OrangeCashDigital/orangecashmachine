    tras remediacion, test de integracion con Kafka real verificando evento en ohlcv.raw'
  - 'verificacion: rg de callers de _build_kafka_publisher = 0 (estado actual, codigo
    muerto)'
  adr_relacionado: null
  riesgo_residual: 'Mitigado en produccion: RuntimeError fail-fast en OHLCVPipeline.__init__
    y en pipeline_factory._build_ohlcv impide NullOHLCVPublisher cuando environment=production.
    Riesgo vivo confirmado fuera de produccion (dev/paper/staging sin Kafka disponible):
    NullOHLCVPublisher.publish_chunk() retorna True sin escribir nada -> cursor avanza,
    metricas de exito suben, dato descartado en silencio (solo un logging.warning).
    Docstring de NullOHLCVPublisher dice ''SOLO para tests unitarios'' pero pipeline_factory._build_ohlcv
    lo usa tambien en runtime fuera de produccion. CORREGIDO (2026-08-12): comentario
    en market_data/main.py:239-240 (''modo degradado escribe directo a Iceberg via
    ctx.kafka_producer=None path'') era incorrecto segun el codigo verificado -- NullOHLCVPublisher
    no escribe a Iceberg ni a ningun lado, solo descarta el chunk. Actualizado para
    describir el comportamiento real; ademas regla L5 PRODUCTION_REQUIRES_KAFKA_PUBLISHER
    adelanta el fail-fast a config-load (ocm/config/layers/rules.py), fuera de produccion
