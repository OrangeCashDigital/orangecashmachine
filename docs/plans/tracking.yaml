f2_6d_decision_escalabilidad:
  estado: HECHO
  fecha_cierre: "2026-08-10"
  bloqueado_por: null
  entregable: "Decisión de escalabilidad con evidencia F2.6c: proceso único systemd + Kafka local SUFICIENTE para el canary — sin ADR de escalabilidad (la evidencia no lo justifica). Documentado en docs/planning/fase3.5c-capacity-empirico.md (conclusión DOD F2.6)"
  decision: >
    La evidencia empírica de F2.6c (canary 30 min: 138.5 msg/s, 0 errores,
    CPU 0.00%, RAM 40.4 MB, p50/p99 7.55/33.8 ms, 3 símbolos book depth 50)
    está muy por debajo del umbral de invalidación de F2.6a (>50-100 símbolos
    activos, >50% CPU, p99 >500 ms, lag creciente). POR TANTO no se crea ADR
    de escalabilidad: la arquitectura de proceso único (systemd) + Kafka local
    es suficiente para el volumen actual y esperado a corto plazo. F5 (catalog
    remoto, Dagster/Flink, DuckDB) queda bloqueado a no ser que una re-medición
    con más símbolos/exchanges cruce el umbral — revalidar con la misma
    metodología antes de cualquier tooling de escala.
  prerequisito_f5: "ningún entregable de F5 se implementa sin que este assessment demuestre con métricas que la carga excede un solo servidor (criterio de salida de F2.6, PLAN-Maestro §4)"
  riesgo_residual: >
    Suficiencia afirmada para el canary; la producción final (más
    exchanges/símbolos, 6-12 meses) se sostiene por margen de CPU/RAM (0%/40MB)
    pero vuelve a medirse si se superan ~50-100 libros activos o aparece
    lag/CPU en tensión. kafka_throughput y kafka_lag no medidos (sin exporter /
    sin consumer) — cierre opcional en re-medición.
  cadena:
    hallazgo: {estado: HECHO, referencia: "F2.6d en tracking v2"}
    backlog: {estado: HECHO, referencia: "F2.6 sub-secuencia a-d en PLAN-Maestro-Ingenieria.md §F2.6"}
