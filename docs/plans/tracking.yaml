  - 'actionlint ocm-ci.yml → exit 0'
  adr_relacionado: ADR-0022, ADR-0037
  riesgo_residual: |
    Bajo tras implementación: unit declarativa validada + mecanismo de artifact digest operativo. GAPs: (a) activación systemctl real en host OrangeHouse requiere root; (b) CD real requiere self-hosted runner o SSH (0 runners registrados); (c) build no reproducible → digest verificable solo en contexto único (build+deploy en el mismo host).
