# ==============================================================================
# OrangeCashMachine — Hydra Root Configuration
# ==============================================================================
# Entry point único. Solo ensambla. Sin lógica de negocio.
#
# CLI USAGE:
#   uv run python -m app.cli.main                                     # dev (default)
#   uv run python -m app.cli.main env=production                      # prod
#   uv run python -m app.cli.main env=test                            # test
#   uv run python -m app.cli.main pipeline.historical.backfill_mode=true
#   uv run python -m app.cli.main -m env=development,production       # multirun
# ==============================================================================

defaults:
  # Core
  - base

  # Schemas (Hydra Structured Config — valida tipos antes del merge)
  - pipeline: schema
  - observability: schema

  # Módulos
  - pipeline/historical
  - pipeline/realtime
  - pipeline/resample
  - exchanges/bybit
  - exchanges/kucoin
  - exchanges/kucoinfutures
  - observability/logging
  - observability/metrics
  - storage/datalake
  - datasets
  - risk/risk
  - market_data/feeds
  - market_data/external_ingestion
  - features

  # Entorno (sobreescribe lo anterior)
  - env: development

  # Hydra internal (siempre último)
  - _self_

# ==============================================================================
# HYDRA RUNTIME
# ==============================================================================
hydra:
  run:
    dir: logs/hydra/${oc.env:ENV_NAME,development}/${now:%Y-%m-%d_%H-%M-%S}

  sweep:
    dir: logs/hydra/multirun/${oc.env:ENV_NAME,development}/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}

  job:
    chdir: false

  job_logging:
    root:
      level: INFO

  output_subdir: null
