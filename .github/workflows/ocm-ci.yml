name: OrangeCashMachine CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un solo runner por ref — cancela runs anteriores del mismo PR para ahorrar minutos.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # JOB 1: Lint de arquitectura
  # REGLA: un contrato BROKEN = merge bloqueado. Fail-fast sin excepciones.
  # Comando correcto: uv run lint-imports (import-linter 2.x no tiene __main__.py)
  # Documentación: https://import-linter.readthedocs.io
  # ──────────────────────────────────────────────────────────────────────────
  architecture:
    name: Architecture contracts (import-linter)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Check architecture contracts (no-vacuo)
        run: |
          set -euo pipefail
          out="$(uv run lint-imports --config architecture_linter/importlinter.toml)"
          echo "$out"
          grep -q "kept" <<<"$out"
          n=$(grep -oP '\d+(?=\s+kept)' <<<"$out")
          if [ "$n" -lt 49 ]; then
            echo "::error::Contratos BC activos $n < 49 (baseline F2.1); bajar el conteo requiere ADR + tracking.yaml"
            exit 1
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 1a: engineering-health (F2.0)
  # Gate de coherencia normativa ANTES del resto de F2 (Plan §4 F2.0):
  # Plan Maestro ↔ tracking.yaml ↔ ADR ↔ contratos ↔ CI. Sale de main con
  # exit 1 si los artefactos divergen (regla suprema). Fail-fast: nada más
  # avanza si el Health Check no pasa.
  # ──────────────────────────────────────────────────────────────────────────
  engineering-health:
    name: Engineering Health Check (F2.0)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Engineering health check (F2.0)
        run: uv run python scripts/engineering_health_check.py

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 1b: app-guard (blindaje de la Application Layer)
  # Gate de reglas auto-defendibles de apps/ (AUDIT-apps-2026-08-03, R12–R16):
  # el guard AST (scripts/app_layer_guard.py) bloquea reintroducción de
  # H1/H4/H6/H8/H12 y complementa los contratos BC-53/54, que no ven lazy
  # imports. Mypy de apps/ es el gate de tipado de la capa de aplicación
  # (complementa el mypy shared/ del job quality). Corre tras architecture.
  # ──────────────────────────────────────────────────────────────────────────
  app-guard:
    name: App layer guard (AST + mypy apps)
    runs-on: ubuntu-latest
    needs: [architecture, engineering-health]

    steps:
      - uses: actions/checkout@v4
        with:
          # Historico completo: el backtest del guard (scripts/backtest_app_guard.py)
          # extrae snapshots pre-fix (39687e7, cdd7e7e) via git archive.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: App layer AST guard (R12–R16)
        run: uv run pytest tests/architecture/test_app_layer_guard.py -q -m "not integration" --no-cov

      - name: Backtest historico del guard (R12–R16)
        run: uv run python scripts/backtest_app_guard.py

      - name: Mypy (apps)
        run: uv run mypy apps/ --no-incremental

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 1b2: domain-guard (R11 — B-20/H-11)
  # Gate de pureza de dominio: el guard AST (scripts/domain_subprocess_guard.py)
  # bloquea reintroducción de subprocess en packages/*/domain/ (el git_hash se
  # inyecta desde el composition root — ADR-0006). Corre tras architecture.
  # ──────────────────────────────────────────────────────────────────────────
  domain-guard:
    name: Domain purity guard (R11)
    runs-on: ubuntu-latest
    needs: [architecture, engineering-health]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Domain subprocess guard (R11)
        run: uv run pytest tests/architecture/test_domain_subprocess_guard.py -q -m "not integration" --no-cov

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 1c: trading-guards (R9/R10 — motor de ejecución live, ADR-0016)
  # Gate de reglas auto-defendibles de trading/execution:
  #   R9  → reconciliación de fills confirmada por el exchange (fail-closed)
  #   R10 → conversión size_pct → qty en coordenadas del exchange
  # Cada regla activa debe tener backtest=ok y activada_en_ci=true (esta job).
  # Corre tras architecture; unit-tests ya ejecuta el resto de la suite.
  # ──────────────────────────────────────────────────────────────────────────
  trading-guards:
    name: Trading guards (R9/R10)
    runs-on: ubuntu-latest
    needs: [architecture, engineering-health]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Live executor rules (R9/R10)
        run: >-
          uv run pytest tests/trading/test_live_executor.py
          tests/trading/test_transport_mapping.py
          -q -m "not integration" --no-cov

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 2a: Unit tests
  # Sin infraestructura externa. Fail-fast: -x detiene en el primer fallo.
  # No requiere Kafka/Redis reales — se excluyen vía marker `integration`
  # (SSOT del marker: pyproject.toml [tool.pytest.ini_options]).
  # ──────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: [architecture, engineering-health]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Run unit tests with coverage gate
        # R5 (B-06/F2.1): fail_under=40 sobre el baseline real 44% (margen),
        # subiéndolo gradualmente. Un descenso por debajo rompe el CI.
        run: >-
          uv run pytest tests/ -x -q -m "not integration"
          --cov=packages --cov=ocm --cov=shared --cov=apps
          --cov-report=term

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 1d: security (R6 — B-07/F2.1)
  # Gate de seguridad: bandit -ll sobre el código no test, umbral BLOCKER.
  # R6 activada_en_ci=true en tracking.yaml.
  # ──────────────────────────────────────────────────────────────────────────
  security:
    name: Security audit (bandit)
    runs-on: ubuntu-latest
    needs: [architecture, engineering-health]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Bandit (R6)
        run: uv run bandit -r apps ocm packages shared infrastructure -ll

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 2b: Integration tests
  # Requiere Kafka real — se levanta como service container con healthcheck
  # (dependency-satisfaction: el job espera a que Kafka esté listo antes de
  # correr tests, sin condiciones de carrera).
  # No usa -x: queremos ver todos los fallos de integración de una vez.
  # ──────────────────────────────────────────────────────────────────────────
  integration-tests:
    name: Integration tests (Kafka)
    runs-on: ubuntu-latest
    needs: [architecture, engineering-health]

    services:
      kafka:
        image: confluentinc/cp-kafka:7.6.0
        ports:
          - 9093:9093
        env:
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: "broker,controller"
          KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9093,CONTROLLER://0.0.0.0:9094"
          KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9093"
          KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
          KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9094"
          CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
        options: >-
          --health-cmd "kafka-broker-api-versions --bootstrap-server localhost:9093"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 15s

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Run integration tests
        run: uv run pytest tests/ -q -m integration --no-cov

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 3: Validación de config
  # Separado de tests — valida que Hydra/OmegaConf arranca sin errores.
  # No depende de architecture directamente (puede correr en paralelo con tests).
  # ──────────────────────────────────────────────────────────────────────────
  config-validation:
    name: Config validation (Hydra bootstrap)
    runs-on: ubuntu-latest
    needs: [architecture, engineering-health]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Validate config
        run: OCM_VALIDATE_ONLY=true uv run python -m app.cli.main

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 4: Quality gates
  # ruff + format + mypy + SSOT + pip-audit. Corre tras architecture (fail-fast).
  # Cualquier fallo aquí impide el merge.
  # ──────────────────────────────────────────────────────────────────────────
  quality:
    name: Quality gates (ruff/mypy/SSOT/audit)
    runs-on: ubuntu-latest
    needs: [architecture, engineering-health]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format . --check

      - name: Mypy (all production code)
        # Guardrail #8: mypy . es la barrera real (packages/, ocm/, shared/,
        # infrastructure/, scripts/). Excluye tests/ y .venv/ via [tool.mypy].
        # apps/ sigue verificado también por app-guard (mypy apps/).
        run: uv run mypy . --no-incremental

      - name: SSOT literales
        run: uv run python scripts/check_ssot_enums.py

      - name: Vulnerabilidades (pip-audit)
        # Risk-accept documentado (2026-08-03): pyarrow 19.0.1 (PYSEC-2026-113) y
        # ecdsa 0.19.2 transitiva de python-jose (PYSEC-2026-1325). Actualizar junto
        # al pin de pyarrow (<20.0) o python-jose cuando se valide en staging.
        run: uv run pip-audit . --ignore-vuln PYSEC-2026-113 --ignore-vuln PYSEC-2026-1325

      - name: Production gates (code-level, G1/G2/G3/G10/G11)
        # B-49: veredicto binario PASS/BLOCK sobre gates de nivel código.
        run: uv run python scripts/check_production_gates.py --mode gate-ci

  # ──────────────────────────────────────────────────────────────────────────
  # JOB: policy-gate (ADR-0032, B-52)
  # Verifica integridad de archivos policy-critical calculando SHA256
  # y comparando contra policies/evidence.json (artifact inmutable).
  # FAIL si mismatch → evidencia de manipulación (Caso B/E threat model).
  # ──────────────────────────────────────────────────────────────────────────
  policy-gate:
    name: Policy gate (evidence hash)
    runs-on: ubuntu-latest
    needs: [architecture, engineering-health]

    steps:
      - uses: actions/checkout@v4

      - name: Verify policy evidence hashes
        run: |
          set -euo pipefail
          echo "=== Policy Gate: Evidence Hash Verification (ADR-0032) ==="

          # Calculate current SHA256 hashes
          current_hash_app_guard=$(sha256sum scripts/app_layer_guard.py | awk '{print $1}')
          current_hash_backtest_guard=$(sha256sum scripts/backtest_app_guard.py | awk '{print $1}')
          current_hash_domain_guard=$(sha256sum scripts/domain_subprocess_guard.py | awk '{print $1}')
          current_hash_registry=$(sha256sum policies/registry.yaml | awk '{print $1}')
          current_hash_workflow=$(sha256sum .github/workflows/ocm-ci.yml | awk '{print $1}')

          # Read expected hashes from evidence.json
          expected_hash_app_guard=$(python3 -c "import json; print(json.load(open('policies/evidence.json'))['files']['scripts/app_layer_guard.py'])")
          expected_hash_backtest_guard=$(python3 -c "import json; print(json.load(open('policies/evidence.json'))['files']['scripts/backtest_app_guard.py'])")
          expected_hash_domain_guard=$(python3 -c "import json; print(json.load(open('policies/evidence.json'))['files']['scripts/domain_subprocess_guard.py'])")
          expected_hash_registry=$(python3 -c "import json; print(json.load(open('policies/evidence.json'))['files']['policies/registry.yaml'])")
          expected_hash_workflow=$(python3 -c "import json; print(json.load(open('policies/evidence.json'))['files']['.github/workflows/ocm-ci.yml'])")

          # Compare
          fail=0
          check_hash() {
            local file="$1" current="$2" expected="$3"
            if [ "$current" != "$expected" ]; then
              echo "::error::MISMATCH $file: current=$current expected=$expected"
              fail=1
            else
              echo "✓ $file: OK"
            fi
          }

          check_hash "scripts/app_layer_guard.py" "$current_hash_app_guard" "$expected_hash_app_guard"
          check_hash "scripts/backtest_app_guard.py" "$current_hash_backtest_guard" "$expected_hash_backtest_guard"
          check_hash "scripts/domain_subprocess_guard.py" "$current_hash_domain_guard" "$expected_hash_domain_guard"
          check_hash "policies/registry.yaml" "$current_hash_registry" "$expected_hash_registry"
          check_hash ".github/workflows/ocm-ci.yml" "$current_hash_workflow" "$expected_hash_workflow"

          if [ "$fail" -eq 1 ]; then
            echo ""
            echo "::error::Policy gate FAIL — evidence hash mismatch detected (Caso B/E threat model)."
            echo "If this is an intentional policy change, update policies/evidence.json with new hashes."
            exit 1
          fi

          echo ""
          echo "Policy gate PASS — all evidence hashes match."
