name: Docker lint (Hadolint)

on:
  push:
    paths:
      - 'Dockerfile'
      - '.github/workflows/docker-lint.yml'
  pull_request:
    paths:
      - 'Dockerfile'

jobs:
  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
          ignore: DL3008
